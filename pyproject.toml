[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-trap"
version = "0.1.0"
description = "Coleta e processamento de dados públicos do mercado financeiro brasileiro."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.61,<2",
    "pandas>=2.0,<3",
    "yfinance>=0.2,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*", "research*", "streamlit_apps*", "data_providers*"]
exclude = ["tests*", "notebooks*"]
