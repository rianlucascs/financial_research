[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-trap"
version = "0.1.0"
description = "Coleta e processamento de dados públicos do mercado financeiro brasileiro."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.61.1",
    "pandas==2.3.3",
    "yfinance>=0.2,<1",
    "duckdb==1.5.5",
    "requests==2.34.2",
    "selenium==4.47.0",
    "webdriver-manager==4.0.2",
    "python-dotenv==1.2.3",
    "wget==3.2",
    "psutil==7.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*", "research*", "streamlit_apps*", "data_providers*"]
exclude = ["tests*", "notebooks*"]
